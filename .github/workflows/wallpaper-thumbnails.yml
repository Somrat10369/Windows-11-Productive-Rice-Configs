name: Generate wallpaper thumbnails

on:
  push:
    paths:
      - "Wallpaper/Wallpapers/**"
      - "Wallpaper/scripts/generate_thumbnails.py"
      - ".github/workflows/wallpaper-thumbnails.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wallpaper-thumbnails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out wallpaper files only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # The repository contains an unrelated Vivaldi symlink that exceeds
          # the runner's filesystem limit. Sparse checkout avoids that path.
          sparse-checkout: |
            Wallpaper/
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate previews and update gallery
        run: python Wallpaper/scripts/generate_thumbnails.py

      - name: Commit generated previews
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Thumbnails and gallery are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Wallpaper/Thumbnails Wallpaper/README.md
          git commit -m "chore: generate wallpaper thumbnails"
          git push

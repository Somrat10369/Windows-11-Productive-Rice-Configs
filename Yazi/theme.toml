[mgr]
cwd = { fg = "#d96930" }

hovered         = { reversed = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#dc4811", bold = true, italic = true, underline = true }
find_position = { fg = "#f16710", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#298eb1", bg = "#298eb1" }
marker_cut      = { fg = "#5e6774", bg = "#5e6774" }
marker_marked   = { fg = "#d96930", bg = "#d96930" }
marker_selected = { fg = "#dc4811", bg = "#dc4811" }

tab_active   = { reversed = true }
tab_inactive = {}
tab_width    = 1

count_copied   = { fg = "#985951", bg = "#298eb1" }
count_cut      = { fg = "#985951", bg = "#5e6774" }
count_selected = { fg = "#985951", bg = "#dc4811" }

border_symbol = "│"
border_style  = { fg = "#298eb1" }

syntect_theme = ""

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#985951", bg = "#985951" }

mode_normal = { bg = "#d96930", bold = true }
mode_select = { bg = "#5e6774", bold = true }
mode_unset  = { bg = "#5e6774", bold = true }

progress_label  = { bold = true }
progress_normal = { fg = "#d96930", bg = "#0f1723" }
progress_error  = { fg = "#5e6774", bg = "#0f1723" }

permissions_t = { fg = "#298eb1" }
permissions_r = { fg = "#dc4811" }
permissions_w = { fg = "#5e6774" }
permissions_x = { fg = "#d96930" }
permissions_s = { fg = "#985951" }

[select]
border   = { fg = "#d96930" }
active   = { fg = "#f16710", bold = true }
inactive = {}

[input]
border   = { fg = "#d96930" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border   = { fg = "#d96930" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#d96930" }
title   = {}
hovered = { fg = "#f16710", underline = true }

[which]
cols            = 3
mask            = { bg = "#0f1723" }
cand            = { fg = "#ab7a47" }
rest            = { fg = "#dc4811" }
desc            = { fg = "#f16710" }
separator       = "  "
separator_style = { fg = "#dc4811" }

[help]
on      = { fg = "#d96930" }
run     = { fg = "#f16710" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#985951", bg = "#d96930" }

[notify]
title_info  = { fg = "#298eb1" }
title_warn  = { fg = "#dc4811" }
title_error = { fg = "#5e6774" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#d96930" },

	# Media
	{ mime = "{audio,video}/*", fg = "#f16710" },

	# Archives
	{ mime = "application/*zip", fg = "#5e6774" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#5e6774" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#d96930" },

	# Fallback
	{ name = "*", fg = "#ab7a47" },
	{ name = "*/", fg = "#298eb1" }
]

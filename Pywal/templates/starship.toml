# starship.toml — Pywal dynamic color flow template
"$schema" = "https://starship.rs/config-schema.json"
format = "[](red)[$os$username]()[](bg:peach fg:red)$directory$time$cmd_duration[](bg:yellow fg:peach)[$git_branch$git_status]()[](fg:yellow bg:green)[$c$rust$golang$bun$php$java$kotlin$haskell$python]()[](fg:green bg:sapphire)[](fg:sapphire bg:lavender)[ ](fg:lavender)$line_break$character"
palette = "pywal"

[palettes.pywal]
rosewater = "{color7}"
flamingo = "{color1}"
pink = "{color5}"
mauve = "{color13}"
red = "{color1}"
maroon = "{color9}"
peach = "{color11}"
yellow = "{color3}"
green = "{color2}"
teal = "{color6}"
sky = "{color14}"
sapphire = "{color4}"
blue = "{color12}"
lavender = "{color13}"
text = "{foreground}"
subtext1 = "{color7}"
subtext0 = "{color7}"
overlay2 = "{color8}"
overlay1 = "{color8}"
overlay0 = "{color8}"
surface2 = "{color8}"
surface1 = "{color8}"
surface0 = "{color0}"
base = "{background}"
mantle = "{background}"
crust = "{background}"

[bun]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[c]
symbol = " "
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:green)"
vimcmd_replace_one_symbol = "[❮](bold fg:lavender)"
vimcmd_replace_symbol = "[❮](bold fg:lavender)"
vimcmd_visual_symbol = "[❮](bold fg:yellow)"

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
show_notifications = true

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = "[$symbol$environment ]($style)"
ignore_base = false

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_symbol = "…/"

[directory.substitutions]
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "
Developer = "󰲋 "

[docker_context]
symbol = ""
style = "bg:sapphire"
format = "[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)"

[git_branch]
symbol = ""
style = "bg:yellow"
format = "[[ $symbol $branch ](fg:crust bg:yellow)]($style)"

[git_status]
style = "bg:yellow"
format = "[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)"

[golang]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[haskell]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[java]
symbol = " "
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[kotlin]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[nodejs]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[os]
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = "0"
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[php]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[python]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version)(\\(#$virtualenv\\)) ](fg:crust bg:green)]($style)"

[rust]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = "[[  $time ](fg:crust bg:lavender)]($style)"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = "[ $user]($style)"
disabled = true